<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#12041d" />
  <title>给我的女孩</title>
  <style>
    /* ============ 基础 ============ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      background: #12041d;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ============ 深色暗紫渐变背景 ============ */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(120, 30, 100, 0.35) 0%, rgba(40, 8, 50, 0.2) 45%, transparent 75%),
        linear-gradient(to bottom, #08010e 0%, #170523 52%, #2a0a33 100%);
    }

    /* ============ 统一心形：100x100 基准盒 + 同一条完整 clip-path ============
       所有爱心共用同一条路径，大小只靠 transform: scale()，永不拉伸变形 */
    .heart-clip {
      clip-path: path('M50 88 C 27 70, 6 51, 6 30 C 6 14, 18 3, 32 3 C 41 3, 47 8, 50 15 C 53 8, 59 3, 68 3 C 82 3, 94 14, 94 30 C 94 51, 73 70, 50 88 Z');
      background: radial-gradient(circle at 32% 26%,
        #fff8fc 0%, #ffdcec 9%, #ff9fce 24%,
        #ff5ba0 45%, #f0257c 65%, #c31461 85%, #930c4a 100%);
    }

    /* ============ 小爱心（炸开碎片，同款圆润心形） ============ */
    .scene {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .small-heart {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100px;
      height: 100px;
      filter: drop-shadow(0 0 7px rgba(255, 90, 170, 0.45));
      will-change: transform, opacity;
      pointer-events: none;
    }

    /* ============ 主爱心 ============ */
    .big-heart {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100px;
      height: 100px;
      z-index: 2;
      pointer-events: none;
      will-change: transform;
    }
    /* 外发光放父层、clip-path 放子层，保证柔光不被裁掉 */
    .big-glow {
      position: absolute;
      inset: 0;
      filter:
        drop-shadow(0 0 22px rgba(255, 70, 150, 0.6))
        drop-shadow(0 0 55px rgba(255, 40, 130, 0.35));
      will-change: transform;
    }
    .big-core { position: absolute; inset: 0; }

    /* 顶部高光（在裁切层内，自然贴着心形边缘） */
    .glare {
      position: absolute;
      top: 9%;
      left: 16%;
      width: 46%;
      height: 26%;
      background: radial-gradient(ellipse at 40% 35%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0) 70%);
      filter: blur(2px);
      pointer-events: none;
    }
    .inner-spot {
      position: absolute;
      top: 20%;
      left: 30%;
      width: 26%;
      height: 14%;
      background: radial-gradient(ellipse, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0) 70%);
      filter: blur(1px);
      pointer-events: none;
    }

    /* 蓄力心跳（作用于发光层，光晕一起脉动） */
    .big-heart.pulse .big-glow {
      animation: beat 0.75s ease-in-out 3;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      16%      { transform: scale(1.13); }
      32%      { transform: scale(0.99); }
      46%      { transform: scale(1.08); }
      62%      { transform: scale(1); }
    }

    /* 炸开消失 */
    .big-heart.explode { animation: heartBoom 0.42s cubic-bezier(0.22, 0.61, 0.36, 1) forwards; }
    @keyframes heartBoom {
      0%   { transform: translate(-50%, -50%) scale(2.55); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(3.1);  opacity: 0; }
    }

    /* ============ 聚焦爱心 ============ */
    .focus-heart {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100px;
      height: 100px;
      transform: translate(-50%, -50%);   /* 关键：父层绝不能 scale(0) */
      z-index: 3;
      pointer-events: none;
      display: none;
    }
    .focus-glow {
      position: absolute;
      inset: 0;
      filter:
        drop-shadow(0 0 30px rgba(255, 55, 140, 0.75))
        drop-shadow(0 0 80px rgba(255, 40, 120, 0.4));
      opacity: 0;
      will-change: transform, opacity;
    }
    .focus-core { position: absolute; inset: 0; }
    .focus-core .glare {
      top: 8%;
      left: 15%;
      width: 48%;
      height: 28%;
    }

    /* ============ 粉色底色铺满 ============ */
    .pink-fill {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(circle at 50% 46%, #ffa4d2 0%, #ff6cab 36%, #ef2f83 70%, #c81865 100%);
      transition: opacity 2.6s cubic-bezier(0.33, 0, 0.2, 1);
      will-change: opacity;
    }

    /* 炸开闪光 */
    .flash {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 50%,
        rgba(255, 230, 245, 0.85) 0%, rgba(255, 120, 190, 0.35) 38%, rgba(255, 60, 140, 0) 68%);
    }

    /* ============ 内容层：照片 / 黑胶 / 文字 / 音乐 ============ */
    .content-wrap {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.6s ease-in-out;
    }
    .content-wrap.show { opacity: 1; pointer-events: auto; }

    .content-wrap .photo-frame,
    .content-wrap .vinyl-row,
    .content-wrap .text-main,
    .content-wrap .tip-text {
      opacity: 0;
      transform: translateY(26px);
    }
    .content-wrap.show .photo-frame { animation: riseInFrame 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) 0.15s forwards; }
    .content-wrap.show .vinyl-row   { animation: riseIn 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) 0.45s forwards; }
    .content-wrap.show .text-main   { animation: riseIn 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) 0.75s forwards; }
    .content-wrap.show .tip-text    { animation: riseIn 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) 1.05s forwards; }
    @keyframes riseIn {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes riseInFrame {
      to { opacity: 1; transform: translateY(0) rotate(-2.5deg); }
    }

    .photo-frame {
      background: #fff;
      padding: 8px 8px 10px;
      border-radius: 14px;
      transform: translateY(26px) rotate(-2.5deg);
      box-shadow:
        0 14px 40px rgba(140, 10, 70, 0.35),
        0 0 26px rgba(255, 255, 255, 0.25);
    }
    .photo {
      display: block;
      width: min(62vw, 270px);
      height: min(40vh, 320px);
      object-fit: cover;
      border-radius: 8px;
    }

    .vinyl-row {
      margin-top: 26px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    /* 黑胶唱片 */
    .vinyl {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      background:
        repeating-radial-gradient(circle at 50% 50%, #171717 0 2px, #232323 2px 4px),
        #101010;
      box-shadow:
        0 10px 30px rgba(120, 0, 55, 0.45),
        inset 0 0 18px rgba(0, 0, 0, 0.85);
      /* 暂停/继续不重置角度：用 play-state 而不是增删动画 */
      animation: spin 5s linear infinite;
      animation-play-state: paused;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .vinyl.playing { animation-play-state: running; }

    /* 唱片高光 */
    .vinyl::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 210deg,
        rgba(255, 255, 255, 0.16) 0deg, transparent 55deg,
        transparent 175deg, rgba(255, 255, 255, 0.1) 205deg, transparent 250deg);
      pointer-events: none;
    }
    /* 粉色唱片标 */
    .vinyl-label {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44%;
      height: 44%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffd7ea 0%, #ff8ac4 55%, #ef4d95 100%);
      box-shadow: inset 0 0 8px rgba(150, 0, 70, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .label-heart {
      width: 100px;
      height: 100px;
      transform: scale(0.16);
      filter: none;
    }
    /* 中心孔 */
    .vinyl-label::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 9px;
      height: 9px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #101010;
    }

    .song-info { color: #fff; }
    .song-name {
      font-size: 18px;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.45);
    }
    .song-sub {
      margin-top: 6px;
      font-size: 12px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.75);
    }

    .text-main {
      margin-top: 26px;
      color: #fff;
      font-size: 17px;
      line-height: 2;
      letter-spacing: 2px;
      text-align: center;
      text-shadow: 0 2px 14px rgba(150, 10, 70, 0.55);
    }
    .tip-text {
      margin-top: 16px;
      color: #8f1048;
      font-size: 13px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div class="bg-layer"></div>
  <div class="scene" id="scene"></div>

  <!-- 主爱心 -->
  <div class="big-heart" id="bigHeart">
    <div class="big-glow">
      <div class="big-core heart-clip">
        <div class="glare"></div>
        <div class="inner-spot"></div>
      </div>
    </div>
  </div>

  <!-- 聚焦爱心 -->
  <div class="focus-heart" id="focusHeart">
    <div class="focus-glow" id="focusGlow">
      <div class="focus-core heart-clip">
        <div class="glare"></div>
        <div class="inner-spot"></div>
      </div>
    </div>
  </div>

  <div class="pink-fill" id="pinkFill"></div>
  <div class="flash" id="flash"></div>

  <!-- 内容层 -->
  <div class="content-wrap" id="contentWrap">
    <div class="photo-frame"><img class="photo" src="photo.jpg" alt="我们"></div>
    <div class="vinyl-row">
      <div class="vinyl" id="vinylDisk">
        <div class="vinyl-label"><div class="label-heart heart-clip"></div></div>
      </div>
      <div class="song-info">
        <div class="song-name">天外来物</div>
        <div class="song-sub">点击唱片 · 暂停 / 播放</div>
      </div>
    </div>
    <div class="text-main">当牵起你手的那一刻<br>我想爱有万难 我都愿意</div>
    <div class="tip-text" id="tipText">轻轻点一下屏幕 · 音乐就会响起</div>
  </div>

  <audio id="audioPlayer" src="tianwailaiwu.mp3" preload="auto" loop></audio>

  <script>
    /* ================= 元素 ================= */
    const scene      = document.getElementById('scene');
    const bigHeart   = document.getElementById('bigHeart');
    const focusHeart = document.getElementById('focusHeart');
    const focusGlow  = document.getElementById('focusGlow');
    const pinkFill   = document.getElementById('pinkFill');
    const flash      = document.getElementById('flash');
    const contentWrap= document.getElementById('contentWrap');
    const vinylDisk  = document.getElementById('vinylDisk');
    const audioPlayer= document.getElementById('audioPlayer');
    const tipText    = document.getElementById('tipText');

    /* ================= 时间线（顺序不可乱） ================= */
    const TL = {
      floatMs:    2400,   // 1. 开场飘动
      centerMs:   1600,   // 2. 平滑减速回到正中心 → 4000ms
      beats:      3,      // 3. 蓄力心跳次数 → 4000 + 3*750 = 6250ms
      beatMs:     750,
      restMs:     150,    // 蓄力结束稍作停顿
      boomMs:     440,    // 4. 炸开
      focusDelay: 430,    // 5. 炸开后聚焦心出现
      focusMs:    5200,   //    聚焦心非常缓慢持续放大
      pinkDelay:  2400,   // 6. 聚焦心放大中，粉色开始铺满
      contentDelay: 300   // 7. 底色铺满后淡入内容
    };

    const FLOAT_BASE   = 2.3;   // 飘动时基础缩放（视觉约230px）
    const CENTER_SCALE = 2.55;  // 回中后的尺寸

    /* ================= 工具 ================= */
    const easeInOutCubic = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
    const isMobile = matchMedia('(max-width: 600px)').matches;

    function setBigHeart(x, y, r, s) {
      bigHeart.style.transform =
        `translate(-50%, -50%) translate3d(${x}px, ${y}px, 0) rotate(${r}deg) scale(${s})`;
    }

    /* 通用补间：运动首尾值严格连续，杜绝切画 */
    function tween(from, to, dur, ease, onUpdate, onDone) {
      const start = performance.now();
      (function step(now) {
        const p = Math.min((now - start) / dur, 1);
        const e = ease(p);
        const out = {};
        for (const k in to) out[k] = from[k] + (to[k] - from[k]) * e;
        onUpdate(out);
        if (p < 1) requestAnimationFrame(step);
        else onDone && onDone();
      })(start);
    }

    /* ================= 阶段1：开场缓慢飘动（平滑利萨如轨迹） ================= */
    let state = { x: 0, y: 0, r: 0, s: FLOAT_BASE };
    const floatStart = performance.now();

    function floatLoop(now) {
      const t = (now - floatStart) / 1000;
      state.x = Math.sin(t * 0.9) * 115 + Math.sin(t * 0.47 + 1.7) * 55;
      state.y = Math.cos(t * 0.74) * 65 + Math.sin(t * 0.39) * 32;
      state.r = Math.sin(t * 0.6) * 8;
      state.s = FLOAT_BASE + Math.sin(t * 0.8) * 0.07;
      setBigHeart(state.x, state.y, state.r, state.s);
      if (now - floatStart < TL.floatMs) requestAnimationFrame(floatLoop);
      else returnToCenter();
    }

    /* ================= 阶段2：平滑减速回到正中心 ================= */
    function returnToCenter() {
      const from = { ...state };
      tween(from, { x: 0, y: 0, r: 0, s: CENTER_SCALE }, TL.centerMs, easeInOutCubic,
        v => { state = v; setBigHeart(v.x, v.y, v.r, v.s); },
        () => {
          /* 阶段3：规律轻轻蓄力跳动 */
          bigHeart.classList.add('pulse');
          setTimeout(startExplode, TL.beats * TL.beatMs + TL.restMs);
        }
      );
    }

    /* ================= 阶段4：炸开 + 大量大小错落的小爱心 ================= */
    function pickSize() {
      // 加权随机：小 / 中 / 大 / 特大，保证大小层次感
      const r = Math.random();
      if (r < 0.32) return 0.20 + Math.random() * 0.16;  // 小：20~36px
      if (r < 0.70) return 0.38 + Math.random() * 0.30;  // 中：38~68px
      if (r < 0.93) return 0.72 + Math.random() * 0.55;  // 大：72~127px
      return 1.35 + Math.random() * 0.45;                // 特大：135~180px
    }

    function spawnBurst() {
      const count = isMobile ? 46 : 64;
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'small-heart heart-clip';
        scene.appendChild(el);

        const angle = Math.random() * Math.PI * 2;
        const size  = pickSize();
        const dist  = (150 + Math.random() * 260) * (0.72 + size * 0.55);
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist * 0.86 - 45;   // 略向上飘
        const rot = Math.random() * 100 - 50;
        const dur = 2400 + Math.random() * 1500;         // 快慢不一
        const delay = Math.random() * 260;

        const anim = el.animate([
          { transform: `translate(-50%,-50%) translate(0px,0px) rotate(0deg) scale(0)`,
            opacity: 0, easing: 'cubic-bezier(0.34, 1.45, 0.64, 1)' },
          { transform: `translate(-50%,-50%) translate(${dx * 0.42}px, ${dy * 0.42}px) rotate(${rot * 0.6}deg) scale(${size})`,
            opacity: 1, offset: 0.3, easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)' },
          { transform: `translate(-50%,-50%) translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(${size * 1.06})`,
            opacity: 0.95, offset: 0.62, easing: 'cubic-bezier(0.45, 0, 0.55, 1)' },
          { transform: `translate(-50%,-50%) translate(${dx * 1.28}px, ${dy * 1.28 + 34}px) rotate(${rot * 1.35}deg) scale(${size * 0.9})`,
            opacity: 0 }
        ], { duration: dur, delay, fill: 'both' });

        anim.onfinish = () => el.remove();
      }

      // 炸开闪光：一闪而过
      flash.animate(
        [{ opacity: 0 }, { opacity: 0.9, offset: 0.25 }, { opacity: 0 }],
        { duration: 620, easing: 'ease-out' }
      );
    }

    function startExplode() {
      bigHeart.classList.remove('pulse');
      bigHeart.style.transform = '';           // 交给 CSS 动画接管
      bigHeart.classList.add('explode');
      spawnBurst();
      setTimeout(() => { bigHeart.style.display = 'none'; }, TL.boomMs + 60);

      /* 阶段5：聚焦爱心出现——从很小开始非常缓慢平滑放大，全程不变形 */
      setTimeout(startFocusHeart, TL.focusDelay);
    }

    /* ================= 阶段5+6：聚焦心缓慢放大 + 粉色铺满 ================= */
    function startFocusHeart() {
      focusHeart.style.display = 'block';

      // 铺满全屏：心形轮廓到盒中心的最短距离只有 35 个基准单位（顶部凹口 y=15），
      // 必须以最短半径为准：半屏对角线 ÷ 32，再留 10% 余量，保证心形边界完全退出屏幕
      const cover = Math.ceil(Math.hypot(innerWidth, innerHeight) / 2 / 32 * 1.1);

      focusGlow.animate([
        { transform: 'scale(0.12)', opacity: 0 },
        { transform: 'scale(0.32)', opacity: 1, offset: 0.07,
          easing: 'cubic-bezier(0.33, 0, 0.2, 1)' },
        { transform: `scale(${cover})`, opacity: 1 }
      ], { duration: TL.focusMs, easing: 'cubic-bezier(0.36, 0, 0.22, 1)', fill: 'forwards' });

      // 粉色底色在聚焦心放大过程中慢慢铺满
      setTimeout(() => { pinkFill.style.opacity = '1'; }, TL.pinkDelay);

      // 放大结束：心已铺满 → 移除聚焦心，露出纯粉底色
      setTimeout(() => {
        focusHeart.style.display = 'none';
        showContent();
      }, TL.focusMs + TL.contentDelay);
    }

    /* ================= 阶段7：淡入照片 / 黑胶 / 文字 / 音乐 ================= */
    function showContent() {
      contentWrap.classList.add('show');
    }

    /* ================= 音乐交互 ================= */
    let musicStarted = false;

    function tryStartMusic() {
      if (musicStarted) return;
      audioPlayer.play().then(() => {
        musicStarted = true;
        vinylDisk.classList.add('playing');
        tipText.textContent = '点击唱片 · 暂停 / 播放音乐';
      }).catch(() => { /* 被拦截时下一次点击自动重试 */ });
    }

    // 首次点击屏幕任意位置 → 播放音乐，唱片旋转
    document.addEventListener('click', tryStartMusic);

    // 点击黑胶唱片 → 手动暂停 / 继续
    vinylDisk.addEventListener('click', e => {
      e.stopPropagation();
      if (audioPlayer.paused) {
        audioPlayer.play().then(() => {
          musicStarted = true;
          vinylDisk.classList.add('playing');
          tipText.textContent = '点击唱片 · 暂停 / 播放音乐';
        }).catch(() => {});
      } else {
        audioPlayer.pause();
        vinylDisk.classList.remove('playing');
      }
    });

    /* ================= 启动 ================= */
    setBigHeart(state.x, state.y, state.r, state.s);
    requestAnimationFrame(floatLoop);
  </script>

</body>
</html>
